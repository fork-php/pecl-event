name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          # 8.6 has no final release yet, this tag follows its latest pre-release
          - "8.6-rc"
          - "8.5.2"
          - "8.4"
          - "8.3.10"
        sanitizer:
          - none
        include:
          - php: "8.5.2" # latest stable version for ASAN builds
            sanitizer: asan

    container:
      image: php:${{ matrix.php }}-cli

    steps:
      - uses: actions/checkout@v6

      - name: Install libevent and OpenSSL
        run: apt-get update && apt-get install -y libevent-dev libssl-dev

      - name: Build and run tests
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        shell: bash
        run: |
          ./ci/setup-php-docker.sh
          ./ci/build.sh
          docker-php-ext-enable --ini-name z-event.ini event
          ./ci/test.sh

  ci:
    name: CI
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix result
        run: |
          test '${{ needs.test.result }}' = 'success'
