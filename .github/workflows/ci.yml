name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          # 8.6 has no final release yet, this tag follows its latest pre-release
          - "8.6-rc"
          - "8.5.2"
          - "8.4"
          - "8.3.10"

    container:
      image: php:${{ matrix.php }}-cli

    steps:
      - uses: actions/checkout@v6

      - name: Install libevent and OpenSSL
        run: apt-get update && apt-get install -y libevent-dev libssl-dev

      - name: Build and run tests
        shell: bash
        run: |
          docker-php-ext-install sockets
          docker-php-ext-enable --ini-name 0-sockets.ini sockets

          docker-php-source extract

          phpize
          ./configure --with-event-core --with-event-extra --with-event-openssl --with-openssl-dir
          make install

          docker-php-ext-enable --ini-name z-event.ini event

          NO_INTERACTION=1 \
            TEST_PHP_EXECUTABLE="$(which php)" \
            php run-tests.php

          docker-php-source delete

  ci:
    name: CI
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix result
        run: |
          test '${{ needs.test.result }}' = 'success'
